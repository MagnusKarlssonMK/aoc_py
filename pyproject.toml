[project]
name = "aoc-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MagnusKarlssonMK", email = "magnus.karlsson.mk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "sympy>=1.14.0",
]

[project.scripts]
aoc-py = "aoc_py:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]

[tool.coverage.run]
omit = [
  "src/**/__init__.py",
  "src/aoc_py/runner.py",
  "src/aoc_py/**/tests/**",
]

[tool.pytest.ini_options]
addopts = "--cov=src/aoc_py --cov-report=term-missing -m 'not regression'"
markers = [
    "regression: end-to-end checks against the stored .answer files (slow; run with -m regression)",
]
